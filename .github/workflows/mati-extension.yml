name: mati-extension

on:
  pull_request:
  push:
    branches:
      - main
      - "cursor/**"

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter mati typecheck
      - run: pnpm --filter mati test
      - run: pnpm --filter mati package
      - uses: actions/upload-artifact@v4
        with:
          name: mati-vsix
          path: extensions/mati/*.vsix

  publish-vscode-marketplace:
    if: false
    runs-on: ubuntu-latest
    needs: test-and-package
    steps:
      - run: echo "Marketplace and Open VSX publish stay disabled until Amit approves."

  publish-open-vsx:
    if: false
    runs-on: ubuntu-latest
    needs: test-and-package
    steps:
      - run: echo "Marketplace and Open VSX publish stay disabled until Amit approves."
